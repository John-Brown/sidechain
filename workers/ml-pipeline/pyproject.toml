[project]
name = "annotation-ml-pipeline"
version = "0.1.0"
description = "ML processing pipeline for annotation platform (VAD, transcription, etc.)"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.73",
    "torch>=2.2",
    "torchaudio>=2.2",
    "boto3>=1.34",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# CPU-only torch — Modal image handles GPU separately if needed
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
