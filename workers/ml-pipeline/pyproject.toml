[project]
name = "annotation-ml-pipeline"
version = "0.2.0"
description = "ML processing pipeline for annotation platform (VAD, transcription, facial tracking, diarization, etc.)"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.73",
    "torch>=2.2",
    "torchaudio>=2.2",
    "boto3>=1.34",
    "pydantic>=2.6",
    "faster-whisper>=1.0",
    "whisperx>=3.1",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
    "pyannote.audio>=3.1",
    "anthropic>=0.30",
    "numpy>=1.26",
    "transformers>=4.40",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stages"]

[tool.uv]
# CPU-only torch for local dev — Modal images handle GPU separately
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
